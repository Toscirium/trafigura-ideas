name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck + test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [shared, server, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        if: matrix.workspace != 'shared'
        run: npm run typecheck -w ${{ matrix.workspace }}

      - name: Typecheck (shared)
        if: matrix.workspace == 'shared'
        run: npx tsc -p packages/shared --noEmit

      - name: Test
        if: matrix.workspace != 'shared'
        run: npm run test -w ${{ matrix.workspace }}
