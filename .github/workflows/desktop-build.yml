name: Desktop build

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            sidecar_target: x86_64-unknown-linux-gnu
          - platform: windows
            os: windows-latest
            sidecar_target: x86_64-pc-windows-msvc
          # macos-latest runners are Apple Silicon (aarch64) as of this workflow; an
          # Intel (x86_64-apple-darwin) build would need an additional macos-13 job.
          - platform: macos
            os: macos-latest
            sidecar_target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app
        working-directory: packages/desktop
        env:
          SIDECAR_TARGET_TRIPLE: ${{ matrix.sidecar_target }}
        run: npm run build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: meridian-${{ matrix.platform }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/**/*.deb
            packages/desktop/src-tauri/target/release/bundle/**/*.rpm
            packages/desktop/src-tauri/target/release/bundle/**/*.AppImage
            packages/desktop/src-tauri/target/release/bundle/**/*.msi
            packages/desktop/src-tauri/target/release/bundle/**/*.exe
            packages/desktop/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error
